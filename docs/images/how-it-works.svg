<svg xmlns="http://www.w3.org/2000/svg" width="944" height="360" viewBox="0 0 944 360" role="img" aria-label="Two scans produce two SQLite snapshots; their per-directory difference becomes a ranked HTML report.">
  <rect width="944" height="360" fill="#ffffff"/>

  <!-- stage captions -->
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8c959f">
    <text x="28" y="26">SCAN</text>
    <text x="242" y="26">STORE</text>
    <text x="462" y="26">COMPARE</text>
    <text x="712" y="26">REPORT</text>
  </g>

  <!-- Run 1 -->
  <rect x="28" y="44" width="186" height="96" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <text x="44" y="70" font-size="14" font-weight="600" fill="#1f2328">Run 1 &#183; Monday</text>
    <text x="44" y="92" font-size="12" fill="#59636e">DiskGrowthMonitor.exe</text>
    <text x="44" y="111" font-size="12" fill="#59636e">-d C</text>
    <text x="44" y="130" font-size="11.5" fill="#8c959f">~20 s &#183; 191k directories</text>
  </g>

  <!-- Run 2 -->
  <rect x="28" y="196" width="186" height="96" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <text x="44" y="222" font-size="14" font-weight="600" fill="#1f2328">Run 2 &#183; next week</text>
    <text x="44" y="244" font-size="12" fill="#59636e">DiskGrowthMonitor.exe</text>
    <text x="44" y="263" font-size="12" fill="#59636e">-d C --open</text>
    <text x="44" y="282" font-size="11.5" fill="#8c959f">1.6 s &#183; unchanged roots reused</text>
  </g>

  <!-- Snapshot 1 -->
  <rect x="242" y="44" width="200" height="96" rx="9" fill="#ffffff" stroke="#afb8c1" stroke-width="1.4"/>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <text x="258" y="70" font-size="14" font-weight="600" fill="#1f2328">Snapshot &#9312;</text>
    <text x="258" y="92" font-size="12" fill="#59636e">one row per directory</text>
    <text x="258" y="111" font-size="12" fill="#59636e">subtree bytes + file IDs</text>
    <text x="258" y="130" font-size="11.5" fill="#8c959f">SQLite &#183; deduplicated</text>
  </g>

  <!-- Snapshot 2 -->
  <rect x="242" y="196" width="200" height="96" rx="9" fill="#ffffff" stroke="#afb8c1" stroke-width="1.4"/>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <text x="258" y="222" font-size="14" font-weight="600" fill="#1f2328">Snapshot &#9313;</text>
    <text x="258" y="244" font-size="12" fill="#59636e">one row per directory</text>
    <text x="258" y="263" font-size="12" fill="#59636e">same shape, one week later</text>
    <text x="258" y="282" font-size="11.5" fill="#8c959f">previous snapshot kept</text>
  </g>

  <!-- Diff -->
  <rect x="462" y="112" width="220" height="112" rx="9" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <text x="478" y="141" font-size="14" font-weight="600" fill="#1f2328">Per-directory diff</text>
    <text x="478" y="165" font-size="12" fill="#3d4451">&#916; = current &#8722; previous</text>
    <text x="478" y="188" font-size="12" fill="#3d4451">grown, shrunk, new, removed</text>
    <text x="478" y="211" font-size="11.5" fill="#59636e">sorted in SQL, not in memory</text>
  </g>

  <!-- Report -->
  <rect x="712" y="112" width="204" height="112" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <text x="728" y="141" font-size="14" font-weight="600" fill="#1f2328">One HTML file</text>
    <text x="728" y="165" font-size="12" fill="#59636e">top growers, ranked by &#916;</text>
    <text x="728" y="188" font-size="12" fill="#59636e">each row annotated:</text>
    <text x="728" y="211" font-size="11.5" font-weight="600" fill="#1a7f37">safe</text>
    <text x="760" y="211" font-size="11.5" fill="#8c959f">/</text>
    <text x="768" y="211" font-size="11.5" font-weight="600" fill="#9a6700">caution</text>
    <text x="816" y="211" font-size="11.5" fill="#8c959f">/</text>
    <text x="824" y="211" font-size="11.5" font-weight="600" fill="#cf222e">keep</text>
  </g>

  <!-- arrows: run -> snapshot -->
  <g stroke="#8c959f" stroke-width="1.5" fill="none">
    <path d="M 216 92 H 234"/>
    <path d="M 216 244 H 234"/>
  </g>
  <polygon points="240,92 231,87.5 231,96.5" fill="#8c959f"/>
  <polygon points="240,244 231,239.5 231,248.5" fill="#8c959f"/>

  <!-- arrows: snapshots -> diff -->
  <g stroke="#8c959f" stroke-width="1.5" fill="none">
    <path d="M 444 92 H 452 V 150 H 456"/>
    <path d="M 444 244 H 452 V 186 H 456"/>
  </g>
  <polygon points="460,150 451,145.5 451,154.5" fill="#8c959f"/>
  <polygon points="460,186 451,181.5 451,190.5" fill="#8c959f"/>

  <!-- arrow: diff -> report -->
  <g stroke="#2563eb" stroke-width="1.6" fill="none">
    <path d="M 684 168 H 704"/>
  </g>
  <polygon points="710,168 701,163.5 701,172.5" fill="#2563eb"/>
  <text x="697" y="160" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="10" fill="#2563eb">rank</text>

  <!-- footer note -->
  <text x="28" y="338" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">A treemap can only show the second snapshot. Growth lives in the difference, so the first snapshot has to be kept.</text>
</svg>
