<svg xmlns="http://www.w3.org/2000/svg" width="662" height="22" viewBox="0 0 662 22" role="img" aria-label="Windows 7 SP1+ / 10 / 11; .NET Framework 4.5, nothing to install; x64 only; deletes nothing; MIT licence.">
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5">
    <!-- Windows -->
    <rect x="0.5" y="0.5" width="171" height="21" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="12" cy="11" r="3.5" fill="#0078D4"/>
    <text x="22" y="15.1" fill="#1f2328">Windows 7 SP1+ / 10 / 11</text>

    <!-- .NET -->
    <rect x="180.5" y="0.5" width="197" height="21" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="192" cy="11" r="3.5" fill="#512BD4"/>
    <text x="202" y="15.1" fill="#1f2328">.NET Framework 4.5 &#183; no install</text>

    <!-- x64 -->
    <rect x="386.5" y="0.5" width="81" height="21" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
